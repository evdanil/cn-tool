name: Release

# Publishes the GitHub release of a commit pushed to main whose message asks for it:
#
#   [Release - X.Y.Z]
#   wheel-sha256: <the verified wheel's SHA-256>
#   sdist-sha256: <the verified sdist's SHA-256>
#
# It builds the archive, the wheel and the sdist from that commit's tree, exactly as the release build does, and
# creates the tag vX.Y.Z and the release only when the wheel and the sdist are the verified bytes, the version is the
# tree's own, the commit is still the head of main, and neither the tag nor the release exists yet. Any other push to
# main does nothing. It never publishes to PyPI.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: contains(github.event.head_commit.message, '[Release - ')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout the release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Check the release request
        id: request
        run: python .github/release/publish_release.py request "$RUNNER_TEMP/notes.md"

      - name: Build the archive and the distributions from the commit's tree
        run: |
          umask 022
          mkdir -p "$RUNNER_TEMP/out/stage" "$RUNNER_TEMP/out/dist"
          git archive --format=tar "$GITHUB_SHA" | tar -x -C "$RUNNER_TEMP/out/stage"
          python -m pip install build==1.6.1
          python -c "import shutil, sys; shutil.make_archive(sys.argv[1], 'zip', root_dir=sys.argv[2])" "$RUNNER_TEMP/out/cn-tool-generic" "$RUNNER_TEMP/out/stage"
          python -m build --outdir "$RUNNER_TEMP/out/dist" "$RUNNER_TEMP/out/stage"

      - name: Check the wheel and the sdist are the verified build
        run: python .github/release/publish_release.py distributions "$RUNNER_TEMP/out/dist"

      - name: Create the tag and the release
        env:
          VERSION: ${{ steps.request.outputs.version }}
        run: |
          python .github/release/publish_release.py ready
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "cn-tool $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --latest \
            "$RUNNER_TEMP/out/cn-tool-generic.zip" "$RUNNER_TEMP/out/dist/cn_tool-$VERSION-py3-none-any.whl" \
            "$RUNNER_TEMP/out/dist/cn_tool-$VERSION.tar.gz"

      - name: Check the published release
        run: python .github/release/publish_release.py published
